<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">哥特风人物头像占位图</title>
  <desc id="desc">冷蓝拱窗、月轮与兜帽剪影，可在替换资料时换成自己的图片。</desc>
  <!-- 渐变定义：月轮光晕、斗篷与冰银边框，与五幕底图同一套冷蓝配色 -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#a9c9ff" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#4c7dff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#04070e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a2b"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe2ff"/>
      <stop offset="1" stop-color="#4c7dff"/>
    </linearGradient>
  </defs>
  <rect width="320" height="320" fill="#04070e"/>
  <circle cx="160" cy="137" r="126" fill="url(#halo)"/>
  <!-- 拱窗轮廓 -->
  <path d="M42 320V143a118 118 0 0 1 236 0v177" fill="none" stroke="url(#rim)" stroke-width="3" opacity=".72"/>
  <path d="M56 320V145a104 104 0 0 1 208 0v175" fill="none" stroke="#a9c9ff" stroke-width="1" opacity=".3"/>
  <circle cx="160" cy="110" r="56" fill="#dce9ff" opacity=".09"/>
  <!-- 兜帽与面部剪影 -->
  <path d="M160 52c-48 0-84 40-84 92 0 37 13 66 30 86l-53 90h214l-53-90c17-20 30-49 30-86 0-52-36-92-84-92z" fill="url(#cloak)"/>
  <path d="M160 82c-34 0-55 28-55 67 0 42 25 78 55 78s55-36 55-78c0-39-21-67-55-67z" fill="#c9d8ee" opacity=".82"/>
  <path d="M106 137c9-45 29-69 54-69s45 24 54 69c-16-17-33-25-54-25s-38 8-54 25z" fill="#0b1220"/>
  <path d="M129 150h20m22 0h20" stroke="#22304a" stroke-width="4" stroke-linecap="round"/>
  <path d="M145 190q15 10 30 0" fill="none" stroke="#6b7e9c" stroke-width="3" stroke-linecap="round"/>
  <!-- 衣领与装饰 -->
  <path d="M119 221l41 44 41-44" fill="none" stroke="#a9c9ff" stroke-width="3" opacity=".75"/>
  <path d="M160 266v34m-13-17l13 17 13-17" fill="none" stroke="#4c7dff" stroke-width="3" stroke-linecap="round"/>
  <text x="160" y="309" fill="#a9c9ff" font-family="Georgia, serif" font-size="13" letter-spacing="5" text-anchor="middle" opacity=".7">NOCTURNE</text>
</svg>
