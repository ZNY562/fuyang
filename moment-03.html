      <h1>最近喜欢留白</h1>
      <p class="note-lead">少一点安排，多一点呼吸。让喜欢的音乐慢慢播完，也给还没想清楚的事情一点时间。</p>
      <div class="note-divider" aria-hidden="true"></div>
      <div class="note-copy">
        <p>最近开始把日程空出一点位置，不急着用新的事情把每个空隙填满。</p>
        <p>有时就坐一会儿，听一首歌从头到尾。暂时没有答案也没关系，等思绪慢慢沉下来，再决定下一步要往哪里走。</p>
      </div>
      <blockquote class="note-quote">不必每一刻都急着抵达。</blockquote>
      <div class="note-tags"><span># 生活随想</span><span># 慢一点也可以</span></div>
